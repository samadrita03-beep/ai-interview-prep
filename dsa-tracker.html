<!DOCTYPE html>
<html>
    <head>
        <title>DSA Tracker</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <nav>
                <a href="index.html">Home</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="dsa-tracker.html">DSA Tracker</a>
            </nav>
        </header>

        <section>
            <h1>Your DSA Progress</h1>
            <input type="text" id="newProblemInput" placeholder="Enter problem name">
            <select id="difficultySelect">
                <option value="Easy">Easy</option>
                <option value="Medium">Medium</option>
                <option value="Hard">Hard</option>
            </select>
            <button onclick="addProblem()">Add Problem</button>
            <ul id="topicList"></ul>
        </section>

        <section>
            <div class="cards-container">
                <div class="card">
                    <h3>Easy Solved</h3>
                    <p id="easyCount">0</p>
                </div>
                <div class="card">
                    <h3>Medium Solved</h3>
                    <p id="mediumCount">0</p>
                </div>
                <div class="card">
                    <h3>Hard Solved</h3>
                    <p id="hardCount">0</p>
                </div>
            </div>
        </section>

        <script>
            let problems = [
                { name: "Two Sum", difficulty: "Easy", solved: false },
                { name: "Binary Search", difficulty: "Easy", solved: true },
                { name: "Merge Intervals", difficulty: "Medium", solved: false }
            ];

            let saved = localStorage.getItem("myProblems");
            if (saved) {
                problems = JSON.parse(saved);
            }

            function renderProblems() {
                document.getElementById("topicList").innerHTML = "";

                for (let i = 0; i < problems.length; i++) {
                    let listItem = document.createElement("li");

                    if (problems[i].solved) {
                        listItem.textContent = problems[i].name + " (" + problems[i].difficulty + ") ✅";
                    } else {
                        listItem.textContent = problems[i].name + " (" + problems[i].difficulty + ") ❌";
                    }

                    listItem.onclick = function() {
                        problems[i].solved = !problems[i].solved;
                        localStorage.setItem("myProblems", JSON.stringify(problems));
                        renderProblems();
                        updateStats();
                    };

                    document.getElementById("topicList").appendChild(listItem);
                }
            }

            function updateStats() {
                let easy = 0, medium = 0, hard = 0;

                for (let i = 0; i < problems.length; i++) {
                    if (problems[i].solved) {
                        if (problems[i].difficulty === "Easy") easy++;
                        if (problems[i].difficulty === "Medium") medium++;
                        if (problems[i].difficulty === "Hard") hard++;
                    }
                }

                document.getElementById("easyCount").textContent = easy;
                document.getElementById("mediumCount").textContent = medium;
                document.getElementById("hardCount").textContent = hard;
            }

            function addProblem() {
                let name = document.getElementById("newProblemInput").value;
                let difficulty = document.getElementById("difficultySelect").value;


                if (name === "") {
                    return;
                }

                problems.push({ name: name, difficulty: "Easy", solved: false });
                localStorage.setItem("myProblems", JSON.stringify(problems));
                document.getElementById("newProblemInput").value = "";

                renderProblems();
                updateStats();
            }

            renderProblems();
            updateStats();
        </script>
    </body>
</ht
