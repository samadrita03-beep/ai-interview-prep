<!DOCTYPE html>
<html>
    <head>
        <title>DSA Tracker</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <header>
            <nav>
                <a href="index.html">Home</a>
                <a href="dashboard.html">Dashboard</a>
                <a href="dsa-tracker.html">DSA Tracker</a>
            </nav>
        </header>

        <section>
            <h1>Your DSA Progress</h1>
            <ul id="topicList"></ul>
        </section>

        <section>
            <div class="cards-container">
                <div class="card">
                    <h3>Easy Solved</h3>
                    <p>0</p>
                </div>
                <div class="card">
                    <h3>Medium Solved</h3>
                    <p>0</p>
                </div>
                <div class="card">
                    <h3>Hard Solved</h3>
                    <p>0</p>
                </div>
            </div>
        </section>

        <script>
            let problems = [
                { name: "Two Sum", difficulty: "Easy", solved: false },
                { name: "Binary Search", difficulty: "Easy", solved: true },
                { name: "Merge Intervals", difficulty: "Medium", solved: false }
            ];

            function renderProblems() {
                document.getElementById("topicList").innerHTML = "";

                for (let i = 0; i < problems.length; i++) {
                    let listItem = document.createElement("li");

                    if (problems[i].solved) {
                        listItem.textContent = problems[i].name + " (" + problems[i].difficulty + ") ✅";
                    } else {
                        listItem.textContent = problems[i].name + " (" + problems[i].difficulty + ") ❌";
                    }

                    listItem.onclick = function() {
                        problems[i].solved = !problems[i].solved;
                        renderProblems();
                    };

                    document.getElementById("topicList").appendChild(listItem);
                }
            }

            renderProblems();
        </script>
    </body>
</html>
